<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SLADE VILLENA @ saronic-graphics-demo</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: white;
      font-family: sans-serif;
      font-size: 14px;
    }
    #resizeControls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type=range] {
      width: 200px;
    }
    input[type=text] {
      width: 50px;
    }
    label {
      margin-right: 5px;
    }
	#joystick {
		position: fixed;
		bottom: 20px;
		left: 20px;
		width: 120px;
		height: 120px;
		background: rgba(255, 255, 255, 0.1);
		border: 2px solid rgba(255, 255, 255, 0.2);
		border-radius: 50%;
		touch-action: none;
		user-select: none;
	}

	#stick {
		position: absolute;
		top: 50%;
		left: 50%;
		width: 40px;
		height: 40px;
		background: rgba(255, 255, 255, 0.5);
		border: 2px solid rgba(255, 255, 255, 0.8);
		border-radius: 50%;
		transform: translate(-50%, -50%);
	}	
  </style>
</head>
<body>
  <div id="ui">
    <div id="resizeControls">
      <label for="resizeSlider">RESIZE TEXTURE</label>
      <input type="range" id="resizeSlider" min="0.25" max="4.0" step="0.01" value="1.0">
      <input type="text" id="resizeSliderMinInput" value="0.25">
      <input type="text" id="resizeSliderMaxInput" value="4.0">
    </div>
	<div id="heightmapControls">
	  <label for="heightmapSlider">HEIGHTMAP FACTOR</label>
	  <input type="range" id="heightmapSlider" min="0.0" max="10.0" step="0.01" value="0.1">
	  <input type="text" id="heightmapMinInput" value="0.0">
	  <input type="text" id="heightmapMaxInput" value="10.0">
	</div>
	<div id="gridResolutionControls">
	  <label for="gridResolutionSlider">GRID RESOLUTION</label>
	  <input type="range" id="gridResolutionSlider" min="10" max="200" step="1" value="50">
	  <input type="text" id="gridResolutionMinInput" value="10">
	  <input type="text" id="gridResolutionMaxInput" value="200">
	</div>
	<div id="weatherZoomControls">
	  <label for="weatherZoomSlider">WEATHER ZOOM</label>
	  <input type="range" id="weatherZoomSlider" min="0.5" max="20.0" step="0.01" value="8.0">
	  <input type="text" id="weatherZoomMinInput" value="0.5">
	  <input type="text" id="weatherZoomMaxInput" value="20.0">
	</div>	
  </div>
  <div id="joystick">
	<div id="stick"></div>
  </div>
  <canvas id="glCanvas"></canvas>
  <script type="module" src="main.js"></script>
</body>
</html>
